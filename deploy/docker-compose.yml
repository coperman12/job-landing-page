# Landing page on the Hostinger VPS, behind the Traefik that already serves n8n.
# On the server it lives in /docker/landing, with the site source in ./src (deploy.sh copies both).
# The host name and the Supabase settings come from /docker/landing/.env (see env.example).
services:
  landing:
    build: ./src
    image: landing-page:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Trust X-Forwarded-For from Traefik, so the rate limit sees the visitor's IP and not the proxy's
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.landing.rule=Host(`${LANDING_HOST}`)
      - traefik.http.routers.landing.entrypoints=websecure
      - traefik.http.routers.landing.tls=true
      - traefik.http.routers.landing.tls.certresolver=mytlschallenge
      - traefik.http.services.landing.loadbalancer.server.port=8080

networks:
  proxy:
    external: true
    name: n8n_default
